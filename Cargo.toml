[package]
name = "noeddns"
version = "0.1.0"
edition = "2021"
authors = ["Boussad Siamer <boussadsiamer8@gmail.com>"]
description = "High-performance, zero-idle-memory Cloudflare DDNS client for Linux"
license = "BSD-2-Clause"

[dependencies]
tokio = { version = "1.40", features = ["rt", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
